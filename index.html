<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>第四大隊救護技術普測報名系統</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --black: #111111;
      --black-2: #222222;
      --yellow: #c8b36a;
      --yellow-soft: #eadca7;
      --paper: #f3efe2;
      --card: #fffaf0;
      --line: #d8c98d;
      --muted: #777062;
      --booked: #d9d3bd;
      --danger: #b42318;
      --ok: #137a3a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: var(--paper);
      color: var(--black);
    }

    header {
      background: var(--black);
      color: white;
      border-bottom: 5px solid var(--yellow);
      padding: 16px 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      max-width: 520px;
      margin: 0 auto;
    }

    .logo {
      width: 72px;
      height: auto;
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 21px;
      line-height: 1.35;
    }

    .hint {
      margin-top: 6px;
      color: var(--yellow-soft);
      font-size: 14px;
      line-height: 1.45;
    }

    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 14px 12px 118px;
    }

    .block {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .label {
      margin: 0 0 10px;
      font-size: 16px;
      font-weight: 900;
    }

    .dates {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    button {
      font-family: inherit;
    }

    .date-btn,
    .slot-btn {
      border-radius: 8px;
      border: 1px solid var(--line);
      background: white;
      color: var(--black);
      font-weight: 900;
      cursor: pointer;
    }

    .date-btn {
      min-height: 56px;
      font-size: 17px;
    }

    .date-btn.active {
      background: var(--black);
      color: var(--yellow-soft);
      border-color: var(--black);
      box-shadow: 0 0 0 3px var(--yellow);
    }

    .chosen {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 8px;
      padding: 12px;
      background: var(--black);
      color: var(--yellow-soft);
      font-size: 16px;
      font-weight: 900;
    }

    .session-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 18px 0 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
      font-size: 17px;
      font-weight: 900;
    }

    .session-head span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .slots {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .slot-btn {
      min-height: 70px;
      padding: 10px 6px;
      font-size: 18px;
    }

    .slot-btn small {
      display: block;
      margin-top: 4px;
      color: #8f7b35;
      font-size: 13px;
    }

    .slot-btn.active {
      background: var(--black);
      color: white;
      border-color: var(--black);
      box-shadow: 0 0 0 3px var(--yellow);
    }

    .slot-btn.active small {
      color: var(--yellow-soft);
    }

    .slot-btn.booked {
      background: var(--booked);
      color: #777061;
      border-color: #c7bea1;
      cursor: not-allowed;
    }

    input {
      width: 100%;
      min-height: 54px;
      margin-bottom: 12px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 17px;
      background: white;
    }

    input:focus {
      outline: 3px solid var(--yellow);
      border-color: var(--black);
    }

    .bottom {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 12px 14px;
      background: rgba(243, 239, 226, 0.97);
      border-top: 1px solid var(--line);
    }

    .bottom-inner {
      max-width: 520px;
      margin: 0 auto;
    }

    .submit {
      width: 100%;
      min-height: 56px;
      border: 0;
      border-radius: 8px;
      background: var(--black);
      color: var(--yellow-soft);
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
    }

    .submit:disabled {
      background: #7d7769;
      cursor: wait;
    }

    .msg {
      display: block;
      min-height: 22px;
      margin-top: 8px;
      text-align: center;
      font-weight: 900;
      line-height: 1.45;
    }

    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--danger); }
  </style>
</head>

<body>
  <header>
    <div class="brand">
      <img class="logo" src="assets/logo.png" alt="第四大隊 LOGO">
      <div>
        <h1>第四大隊救護技術普測報名系統</h1>
        <div class="hint">請選擇日期與時段，已預約時段無法再次選取。</div>
      </div>
    </div>
  </header>

  <main>
    <section class="block">
      <p class="label">測驗日期</p>
      <div id="dateButtons" class="dates"></div>
    </section>

    <section class="block">
      <p class="label">已選擇測驗時間</p>
      <input id="selectedTime" class="chosen" type="text" readonly placeholder="請點選下方可報名時段">

      <div class="session-head">上午場次 <span>09:00 - 11:30</span></div>
      <div id="morningSlots" class="slots"></div>

      <div class="session-head">下午場次 <span>13:00 - 16:00</span></div>
      <div id="afternoonSlots" class="slots"></div>
    </section>

    <section class="block">
      <p class="label">受測人員姓名1</p>
      <input id="name1" type="text" placeholder="請輸入姓名">

      <p class="label">受測人員姓名2</p>
      <input id="name2" type="text" placeholder="請輸入姓名">
    </section>
  </main>

  <div class="bottom">
    <div class="bottom-inner">
      <button id="submitBtn" class="submit" onclick="submitBooking()">送出報名</button>
      <span id="message" class="msg"></span>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      doc,
      onSnapshot,
      runTransaction,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDY2SAXwWPxgFWaUHU7h1ARjwtgo16G2Yo",
      authDomain: "emstest-e3ec1.firebaseapp.com",
      projectId: "emstest-e3ec1",
      storageBucket: "emstest-e3ec1.firebasestorage.app",
      messagingSenderId: "887383383886",
      appId: "1:887383383886:web:452e3a1e8f756119f7c81f"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let allSlots = [];
    let selectedDate = "";
    let selectedSlotId = "";

    window.submitBooking = submitBooking;
    window.selectDate = selectDate;
    window.selectSlot = selectSlot;

    onSnapshot(collection(db, "slots"), snapshot => {
      allSlots = snapshot.docs.map(item => item.data()).sort((a, b) => {
        if (a.dateId !== b.dateId) return a.dateId.localeCompare(b.dateId);
        return a.time.localeCompare(b.time);
      });

      if (allSlots.length === 0) {
        setMessage("目前沒有可報名時段，請先建立時段資料。", "err");
        return;
      }

      const dates = [...new Set(allSlots.map(slot => slot.dateLabel))];

      if (!selectedDate || !dates.includes(selectedDate)) {
        selectedDate = dates[0];
      }

      renderDates();
      renderSlots();
      setMessage("", "");
    }, error => {
      setMessage(error.message || "讀取資料失敗，請稍後再試。", "err");
    });

    function renderDates() {
      const dates = [...new Set(allSlots.map(slot => slot.dateLabel))];
      const box = document.getElementById("dateButtons");

      box.innerHTML = dates.map(date => `
        <button
          type="button"
          class="date-btn ${date === selectedDate ? "active" : ""}"
          onclick="selectDate('${date}')"
        >
          ${date}
        </button>
      `).join("");
    }

    function selectDate(date) {
      selectedDate = date;
      selectedSlotId = "";
      document.getElementById("selectedTime").value = "";
      renderDates();
      renderSlots();
      setMessage("", "");
    }

    function renderSlots() {
      renderSlotGroup("morningSlots", "上午");
      renderSlotGroup("afternoonSlots", "下午");
    }

    function renderSlotGroup(elementId, session) {
      const box = document.getElementById(elementId);
      const slots = allSlots.filter(slot => slot.dateLabel === selectedDate && slot.session === session);

      box.innerHTML = slots.map(slot => {
        const booked = slot.status !== "可報名";
        const active = slot.slotId === selectedSlotId;

        return `
          <button
            type="button"
            class="slot-btn ${booked ? "booked" : ""} ${active ? "active" : ""}"
            ${booked ? "disabled" : ""}
            onclick="selectSlot('${slot.slotId}')"
          >
            ${slot.time}
            <small>${booked ? "已預約" : "可報名"}</small>
          </button>
        `;
      }).join("");
    }

    function selectSlot(slotId) {
      const slot = allSlots.find(item => item.slotId === slotId);

      if (!slot || slot.status !== "可報名") return;

      selectedSlotId = slotId;
      document.getElementById("selectedTime").value = `${slot.dateLabel} ${slot.time}`;
      renderSlots();
      setMessage("", "");
    }

    async function submitBooking() {
      const name1 = document.getElementById("name1").value.trim();
      const name2 = document.getElementById("name2").value.trim();
      const submitBtn = document.getElementById("submitBtn");

      if (!selectedSlotId) {
        setMessage("請先選擇測驗時段。", "err");
        return;
      }

      if (!name1 || !name2) {
        setMessage("請填寫兩位受測人員姓名。", "err");
        return;
      }

      const slot = allSlots.find(item => item.slotId === selectedSlotId);

      if (!slot) {
        setMessage("找不到所選時段，請重新選擇。", "err");
        return;
      }

      const confirmed = window.confirm(
        `請確認報名資料是否正確：\n\n` +
        `報名日期：${slot.dateLabel}\n` +
        `報名時間：${slot.time}\n` +
        `報名場次：${slot.session}\n` +
        `報名人員姓名：${name1}、${name2}\n\n` +
        `確認無誤送出？`
      );

      if (!confirmed) {
        setMessage("已取消送出，請確認資料後再送出。", "err");
        return;
      }

      submitBtn.disabled = true;
      setMessage("報名處理中...", "");

      try {
        await runTransaction(db, async transaction => {
          const slotRef = doc(db, "slots", selectedSlotId);
          const slotDoc = await transaction.get(slotRef);

          if (!slotDoc.exists()) {
            throw new Error("找不到此測驗時段。");
          }

          const current = slotDoc.data();

          if (current.status !== "可報名") {
            throw new Error("此時段已被預約，請重新選擇其他時段。");
          }

          transaction.update(slotRef, {
            status: "已預約",
            name1,
            name2,
            bookedAt: serverTimestamp()
          });
        });

        window.alert("報名完成");
        document.getElementById("name1").value = "";
        document.getElementById("name2").value = "";
        document.getElementById("selectedTime").value = "";
        selectedSlotId = "";
        setMessage("報名成功。", "ok");
      } catch (error) {
        setMessage(error.message || "報名失敗，請重新選擇時段。", "err");
      } finally {
        submitBtn.disabled = false;
      }
    }

    function setMessage(text, type) {
      const msg = document.getElementById("message");
      msg.textContent = text;
      msg.className = `msg ${type || ""}`;
    }
  </script>
</body>
</html>
