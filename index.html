<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>&#31532;&#22235;&#22823;&#38538;&#25937;&#35703;&#25216;&#34899;&#26222;&#28204;&#22577;&#21517;&#31995;&#32113;</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root { --black:#111; --yellow:#c8b36a; --yellow-soft:#eadca7; --paper:#f3efe2; --card:#fffaf0; --line:#d8c98d; --muted:#777062; --booked:#d9d3bd; --danger:#b42318; --ok:#137a3a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,"Noto Sans TC",sans-serif; background:var(--paper); color:var(--black); }
    header { background:var(--black); color:white; border-bottom:5px solid var(--yellow); padding:16px 14px; }
    .brand { display:flex; align-items:center; gap:12px; max-width:520px; margin:0 auto; position:relative; padding-right:82px; }
    .admin-link { position:absolute; top:0; right:0; min-height:34px; border:1px solid var(--yellow); border-radius:8px; padding:7px 9px; color:var(--yellow-soft); text-decoration:none; font-size:13px; font-weight:900; line-height:1.2; }
    .logo { width:72px; height:auto; flex:0 0 auto; }
    h1 { margin:0; font-size:21px; line-height:1.35; }
    .hint { margin-top:6px; color:var(--yellow-soft); font-size:14px; line-height:1.45; }
    main { max-width:520px; margin:0 auto; padding:14px 12px 118px; }
    .block { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px; margin-bottom:12px; }
    .label { margin:0 0 10px; font-size:16px; font-weight:900; }
    .dates,.slots { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
    button { font-family:inherit; }
    .date-btn,.slot-btn { border-radius:8px; border:1px solid var(--line); background:white; color:var(--black); font-weight:900; cursor:pointer; }
    .date-btn { min-height:56px; font-size:17px; }
    .date-btn.active { background:var(--black); color:var(--yellow-soft); border-color:var(--black); box-shadow:0 0 0 3px var(--yellow); }
    .chosen { width:100%; min-height:52px; border:0; border-radius:8px; padding:12px; background:var(--black); color:var(--yellow-soft); font-size:16px; font-weight:900; }
    .session-head { display:flex; justify-content:space-between; align-items:center; margin:18px 0 10px; padding-bottom:8px; border-bottom:1px solid var(--line); font-size:17px; font-weight:900; }
    .session-head span { color:var(--muted); font-size:13px; font-weight:800; }
    .slot-btn { min-height:76px; padding:10px 6px; font-size:18px; }
    .slot-btn small { display:block; margin-top:4px; color:#8f7b35; font-size:13px; line-height:1.25; overflow-wrap:anywhere; }
    .slot-btn.active { background:var(--black); color:white; border-color:var(--black); box-shadow:0 0 0 3px var(--yellow); }
    .slot-btn.active small { color:var(--yellow-soft); }
    .slot-btn.booked { background:var(--booked); color:#777061; border-color:#c7bea1; cursor:not-allowed; }
    input,select { width:100%; min-height:54px; margin-bottom:12px; padding:12px; border:1px solid var(--line); border-radius:8px; font-size:17px; background:white; }
    input:focus { outline:3px solid var(--yellow); border-color:var(--black); }
    .bottom { position:fixed; left:0; right:0; bottom:0; padding:10px 12px 14px; background:rgba(243,239,226,.97); border-top:1px solid var(--line); }
    .bottom-inner { max-width:520px; margin:0 auto; }
    .submit,.cancel-submit { width:100%; min-height:56px; border:0; border-radius:8px; background:var(--black); color:var(--yellow-soft); font-size:18px; font-weight:900; cursor:pointer; }
    .cancel-submit { background:var(--danger); color:white; }
    .submit:disabled,.cancel-submit:disabled { background:#7d7769; cursor:wait; }
    .msg { display:block; min-height:22px; margin-top:8px; text-align:center; font-weight:900; line-height:1.45; }
    .msg.ok { color:var(--ok); } .msg.err { color:var(--danger); }
    details.cancel-panel summary { cursor:pointer; font-size:16px; font-weight:900; list-style:none; }
    details.cancel-panel summary::-webkit-details-marker { display:none; }
    details.cancel-panel summary::after { content:"展開"; float:right; color:var(--muted); font-size:13px; }
    details.cancel-panel[open] summary { margin-bottom:12px; padding-bottom:10px; border-bottom:1px solid var(--line); }
    details.cancel-panel[open] summary::after { content:"收合"; }
    .cancel-persons { min-height:52px; margin-bottom:12px; padding:12px; border:1px solid var(--line); border-radius:8px; background:white; color:var(--muted); font-size:16px; font-weight:900; line-height:1.45; }
  </style>
</head>
<body>
  <header><div class="brand"><a class="admin-link" href="admin.html">&#31649;&#29702;&#32773;<br>&#38913;&#38754;</a><img class="logo" src="assets/logo.png" alt="logo"><div><h1>&#31532;&#22235;&#22823;&#38538;&#25937;&#35703;&#25216;&#34899;&#26222;&#28204;&#22577;&#21517;&#31995;&#32113;</h1><div class="hint">&#35531;&#36984;&#25799;&#26085;&#26399;&#33287;&#26178;&#27573;&#65292;&#24050;&#38928;&#32004;&#26178;&#27573;&#28961;&#27861;&#20877;&#27425;&#36984;&#21462;&#12290;</div></div></div></header>
  <main>
    <section class="block"><p class="label">&#28204;&#39511;&#26085;&#26399;</p><div id="dateButtons" class="dates"></div></section>
    <section class="block"><p class="label">&#24050;&#36984;&#25799;&#28204;&#39511;&#26178;&#38291;</p><input id="selectedTime" class="chosen" type="text" readonly placeholder="&#35531;&#40670;&#36984;&#19979;&#26041;&#21487;&#22577;&#21517;&#26178;&#27573;"><div class="session-head">&#19978;&#21320;&#22580;&#27425; <span>09:00 - 12:00</span></div><div id="morningSlots" class="slots"></div><div class="session-head">&#19979;&#21320;&#22580;&#27425; <span>13:00 - 17:00</span></div><div id="afternoonSlots" class="slots"></div></section>
    <section class="block"><p class="label">&#21463;&#28204;&#20154;&#21729;&#22995;&#21517;1</p><input id="name1" type="text" placeholder="&#35531;&#36664;&#20837;&#22995;&#21517;"><p class="label">&#21463;&#28204;&#20154;&#21729;&#22995;&#21517;2</p><input id="name2" type="text" placeholder="&#35531;&#36664;&#20837;&#22995;&#21517;"></section>
    <section class="block"><details class="cancel-panel"><summary>申請取消報名</summary><p class="label">日期</p><select id="cancelDate" onchange="renderCancelSessionSelector()"></select><p class="label">場次</p><select id="cancelSession" onchange="renderCancelTimeSelector()"></select><p class="label">時間</p><select id="cancelTime" onchange="renderCancelPersons()"></select><p class="label">目前報名組別</p><div id="cancelPersons" class="cancel-persons">請先選擇日期、場次與時間。</div><button id="cancelRequestBtn" class="cancel-submit" onclick="submitCancelRequest()">送出取消申請</button><span id="cancelMessage" class="msg"></span></details></section>
  </main>
  <div class="bottom"><div class="bottom-inner"><button id="submitBtn" class="submit" onclick="submitBooking()">&#36865;&#20986;&#22577;&#21517;</button><span id="message" class="msg"></span></div></div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.0/firebase-app.js";
    import { getFirestore, collection, doc, onSnapshot, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.9.0/firebase-firestore.js";
    const firebaseConfig = {
      apiKey: "AIzaSyDY2SAXwWPxgFWaUHU7h1ARjwtgo16G2Yo",
      authDomain: "emstest-e3ec1.firebaseapp.com",
      projectId: "emstest-e3ec1",
      storageBucket: "emstest-e3ec1.firebasestorage.app",
      messagingSenderId: "887383383886",
      appId: "1:887383383886:web:452e3a1e8f756119f7c81f"
    };
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    let allSlots = [], selectedDate = "", selectedSlotId = "";
    const AVAILABLE = "可報名";
    const BOOKED = "已預約";
    const MORNING = "上午";
    const AFTERNOON = "下午";
    window.submitBooking = submitBooking; window.submitCancelRequest = submitCancelRequest; window.selectDate = selectDate; window.selectSlot = selectSlot; window.renderCancelSessionSelector = renderCancelSessionSelector; window.renderCancelTimeSelector = renderCancelTimeSelector; window.renderCancelPersons = renderCancelPersons;
    onSnapshot(collection(db,"slots"), snapshot => {
      allSlots = snapshot.docs.map(item => item.data()).sort((a,b) => a.dateId !== b.dateId ? a.dateId.localeCompare(b.dateId) : a.time.localeCompare(b.time));
      if (allSlots.length === 0) { setMessage("目前沒有可報名時段，請先建立時段資料。", "err"); return; }
      const dates = [...new Set(allSlots.map(slot => slot.dateLabel))];
      if (!selectedDate || !dates.includes(selectedDate)) selectedDate = dates[0];
      renderDates(); renderSlots(); renderCancelDateSelector(); setMessage("", "");
    }, error => setMessage(error.message || "讀取資料失敗，請稍後再試。", "err"));
    function renderDates() {
      const dates = [...new Set(allSlots.map(slot => slot.dateLabel))];
      document.getElementById("dateButtons").innerHTML = dates.map(date => `<button type="button" class="date-btn ${date === selectedDate ? "active" : ""}" onclick="selectDate('${date}')">${date}</button>`).join("");
    }
    function selectDate(date) { selectedDate = date; selectedSlotId = ""; document.getElementById("selectedTime").value = ""; renderDates(); renderSlots(); setMessage("", ""); }
    function renderSlots() { renderSlotGroup("morningSlots", MORNING); renderSlotGroup("afternoonSlots", AFTERNOON); }
    function getBookedSlots() {
      return allSlots.filter(slot => slot.status === BOOKED);
    }
    function renderCancelDateSelector() {
      const select = document.getElementById("cancelDate");
      const current = select.value;
      const dates = [...new Set(getBookedSlots().map(slot => slot.dateLabel))];
      select.innerHTML = dates.map(date => `<option value="${escapeHtml(date)}">${escapeHtml(date)}</option>`).join("") || `<option value="">目前沒有已報名時段</option>`;
      if (current && dates.includes(current)) select.value = current;
      renderCancelSessionSelector();
    }
    function renderCancelSessionSelector() {
      const date = document.getElementById("cancelDate").value;
      const select = document.getElementById("cancelSession");
      const current = select.value;
      const sessions = [...new Set(getBookedSlots().filter(slot => slot.dateLabel === date).map(slot => slot.session))];
      select.innerHTML = sessions.map(session => `<option value="${escapeHtml(session)}">${escapeHtml(session)}</option>`).join("") || `<option value="">請先選擇日期</option>`;
      if (current && sessions.includes(current)) select.value = current;
      renderCancelTimeSelector();
    }
    function renderCancelTimeSelector() {
      const date = document.getElementById("cancelDate").value;
      const session = document.getElementById("cancelSession").value;
      const select = document.getElementById("cancelTime");
      const current = select.value;
      const slots = getBookedSlots().filter(slot => slot.dateLabel === date && slot.session === session);
      select.innerHTML = slots.map(slot => `<option value="${slot.slotId}">${escapeHtml(slot.time || "")}</option>`).join("") || `<option value="">請先選擇場次</option>`;
      if (current && slots.some(slot => slot.slotId === current)) select.value = current;
      renderCancelPersons();
    }
    function renderCancelPersons() {
      const slot = getSelectedCancelSlot();
      const persons = document.getElementById("cancelPersons");
      if (!slot) {
        persons.textContent = "此條件目前沒有已報名組別。";
        return;
      }
      persons.textContent = `${slot.name1 || ""}、${slot.name2 || ""}`;
    }
    function bookedLabel(slot) {
      const names = [slot.name1, slot.name2].filter(Boolean).join("、");
      return names || BOOKED;
    }
    function renderSlotGroup(elementId, session) {
      const slots = allSlots.filter(slot => slot.dateLabel === selectedDate && slot.session === session);
      document.getElementById(elementId).innerHTML = slots.map(slot => {
        const booked = slot.status !== AVAILABLE, active = slot.slotId === selectedSlotId;
        const label = booked ? bookedLabel(slot) : AVAILABLE;
        return `<button type="button" class="slot-btn ${booked ? "booked" : ""} ${active ? "active" : ""}" ${booked ? "disabled" : ""} onclick="selectSlot('${slot.slotId}')">${slot.time}<small>${label}</small></button>`;
      }).join("");
    }
    function selectSlot(slotId) { const slot = allSlots.find(item => item.slotId === slotId); if (!slot || slot.status !== AVAILABLE) return; selectedSlotId = slotId; document.getElementById("selectedTime").value = `${slot.dateLabel} ${slot.time}`; renderSlots(); setMessage("", ""); }
    async function submitBooking() {
      const name1 = document.getElementById("name1").value.trim(), name2 = document.getElementById("name2").value.trim(), submitBtn = document.getElementById("submitBtn");
      if (!selectedSlotId) return setMessage("請先選擇測驗時段。", "err");
      if (!name1 || !name2) return setMessage("請填寫兩位受測人員姓名。", "err");
      if (name1 === name2) return setMessage("兩位受測人員姓名不可相同。", "err");
      const slot = allSlots.find(item => item.slotId === selectedSlotId);
      if (!slot) return setMessage("找不到所選時段，請重新選擇。", "err");
      const groupKey = buildGroupKey(name1, name2);
      const confirmed = window.confirm(`請確認報名資料是否正確：

報名日期：${slot.dateLabel}
報名時間：${slot.time}
報名場次：${slot.session}
報名人員姓名：${name1}、${name2}

確認無誤送出？`);
      if (!confirmed) return setMessage("您剛才未確認送出，報名尚未完成。", "err");
      submitBtn.disabled = true; setMessage("報名處理中...", "");
      try {
        await runTransaction(db, async transaction => {
          const slotRef = doc(db, "slots", selectedSlotId);
          const groupRef = doc(db, "bookingGroups", groupKey);
          const slotDoc = await transaction.get(slotRef);
          const groupDoc = await transaction.get(groupRef);
          if (!slotDoc.exists()) throw new Error("找不到此測驗時段。");
          if (slotDoc.data().status !== AVAILABLE) throw new Error("此時段已被預約，請重新選擇其他時段。");
          if (groupDoc.exists()) throw new Error("此兩人組別已完成報名，無法重複報名。");
          transaction.update(slotRef, { status:BOOKED, name1, name2, groupKey, bookedAt:serverTimestamp() });
          transaction.set(groupRef, {
            groupKey,
            name1,
            name2,
            slotId: selectedSlotId,
            dateId: slot.dateId || "",
            dateLabel: slot.dateLabel || "",
            session: slot.session || "",
            time: slot.time || "",
            createdAt: serverTimestamp()
          });
        });
        window.alert("報名完成");
        document.getElementById("name1").value = ""; document.getElementById("name2").value = ""; document.getElementById("selectedTime").value = ""; selectedSlotId = ""; setMessage("報名成功。", "ok");
      } catch (error) { setMessage(error.message || "報名失敗，請重新選擇時段。", "err"); } finally { submitBtn.disabled = false; }
    }
    async function submitCancelRequest() {
      const slot = getSelectedCancelSlot();
      const cancelBtn = document.getElementById("cancelRequestBtn");
      if (!slot) return setCancelMessage("請先選擇已報名時段。", "err");
      const slotId = slot.slotId;
      const name1 = String(slot.name1 || "").trim();
      const name2 = String(slot.name2 || "").trim();
      if (!name1 || !name2) return setCancelMessage("此時段缺少報名姓名，請聯絡管理者確認。", "err");
      const groupKey = buildGroupKey(name1, name2);
      if (!confirm(`確定要送出取消申請？\n\n${slot.dateLabel} ${slot.session} ${slot.time}\n${name1}、${name2}\n\n送出後需由管理者審核。`)) return;

      cancelBtn.disabled = true;
      setCancelMessage("取消申請送出中...", "");
      try {
        await runTransaction(db, async transaction => {
          const slotRef = doc(db, "slots", slotId);
          const requestRef = doc(collection(db, "cancelRequests"));
          const slotDoc = await transaction.get(slotRef);
          if (!slotDoc.exists()) throw new Error("找不到此測驗時段。");
          const current = slotDoc.data();
          if (current.status !== BOOKED) throw new Error("此時段目前不是已報名狀態。");
          if (buildGroupKey(current.name1 || "", current.name2 || "") !== groupKey) throw new Error("姓名與目前報名資料不符。");
          transaction.set(requestRef, {
            slotId,
            dateId: current.dateId || "",
            dateLabel: current.dateLabel || "",
            session: current.session || "",
            time: current.time || "",
            name1,
            name2,
            groupKey,
            status: "pending",
            requestedAt: serverTimestamp(),
            reviewedAt: null,
            reviewedBy: "",
            reviewedByEmail: ""
          });
        });
        setCancelMessage("取消申請已送出，請等待管理者審核。", "ok");
      } catch (error) {
        setCancelMessage(error.message || "取消申請送出失敗。", "err");
      } finally {
        cancelBtn.disabled = false;
      }
    }
    function buildGroupKey(name1, name2) {
      return [String(name1 || "").trim(), String(name2 || "").trim()].sort().join("__");
    }
    function getSelectedCancelSlot() {
      const slotId = document.getElementById("cancelTime").value;
      return getBookedSlots().find(item => item.slotId === slotId);
    }
    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
    function setMessage(text, type) { const msg = document.getElementById("message"); msg.textContent = text; msg.className = `msg ${type || ""}`; }
    function setCancelMessage(text, type) { const msg = document.getElementById("cancelMessage"); msg.textContent = text; msg.className = `msg ${type || ""}`; }
  </script>
</body>
</html>
