    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const log = document.getElementById("log");
    const btn = document.getElementById("importBtn");

    btn.addEventListener("click", async () => {
      if (!confirm("確定要匯入並覆蓋 Firebase 內相同時段資料嗎？")) return;
      btn.disabled = true;
      log.textContent = "匯入中，請不要關閉頁面...";
      try {
        let batch = writeBatch(db);
        let pending = 0;
        let total = 0;
        let booked = 0;

        for (const slot of slots) {
          const data = { ...slot };
          if (data.bookedAtText) {
            const parsed = new Date(data.bookedAtText);
            data.bookedAt = isNaN(parsed.getTime()) ? null : Timestamp.fromDate(parsed);
          } else {
            data.bookedAt = null;
          }
          delete data.bookedAtText;
          batch.set(doc(db, "slots", data.slotId), data);
          pending++;
          total++;
          if (data.status === "已預約") booked++;
          if (pending === 450) {
            await batch.commit();
            batch = writeBatch(db);
            pending = 0;
          }
        }
        if (pending > 0) await batch.commit();
        log.textContent = `匯入完成。
總時段：${total} 筆
已預約：${booked} 筆
可報名：${total - booked} 筆`;
      } catch (error) {
        log.textContent = `匯入失敗：${error.message}`;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
