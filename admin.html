<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>&#31532;&#22235;&#22823;&#38538;&#22577;&#21517;&#31995;&#32113;&#31649;&#29702;&#38913;</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --black: #111;
      --yellow: #c8b36a;
      --yellow-soft: #eadca7;
      --paper: #f3efe2;
      --card: #fffaf0;
      --line: #d8c98d;
      --muted: #756f60;
      --danger: #b42318;
      --ok: #137a3a;
      --blue: #155eef;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: var(--paper);
      color: var(--black);
    }

    header {
      background: var(--black);
      color: white;
      border-bottom: 5px solid var(--yellow);
      padding: 8px 14px;
    }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 14px 12px 40px;
    }

    h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.25;
    }

    .hint {
      margin-top: 4px;
      color: var(--yellow-soft);
      font-size: 12px;
      line-height: 1.35;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin: 0 0 7px;
      font-weight: 900;
    }

    input,
    select {
      width: 100%;
      min-height: 48px;
      margin-bottom: 12px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    button {
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      padding: 10px 12px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
    }

    .primary {
      width: 100%;
      background: var(--black);
      color: var(--yellow-soft);
    }

    .secondary {
      background: var(--blue);
      color: white;
    }

    .danger {
      background: var(--danger);
      color: white;
    }

    .ghost {
      border: 1px solid var(--line);
      background: white;
      color: var(--black);
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .msg {
      min-height: 24px;
      margin-top: 8px;
      font-weight: 900;
      line-height: 1.45;
      text-align: center;
    }

    .ok { color: var(--ok); }
    .err { color: var(--danger); }

    .slot-list {
      display: grid;
      gap: 10px;
    }

    .slot-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      padding: 12px;
    }

    .slot-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      font-weight: 900;
    }

    .names {
      margin-bottom: 10px;
      color: var(--muted);
      font-weight: 900;
      line-height: 1.45;
    }

    .hidden { display: none; }

    @media (max-width: 560px) {
      .row,
      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>&#31532;&#22235;&#22823;&#38538;&#22577;&#21517;&#31995;&#32113;&#31649;&#29702;&#38913;</h1>
      <div class="hint">&#21487;&#20462;&#25913;&#22995;&#21517;&#12289;&#37323;&#20986;&#26178;&#27573;&#65292;&#25110;&#23559;&#24050;&#22577;&#21517;&#36039;&#26009;&#31227;&#21040;&#20854;&#20182;&#21487;&#22577;&#21517;&#26178;&#27573;&#12290;</div>
    </div>
  </header>

  <main class="wrap">
    <section id="loginCard" class="card">
      <label for="email">&#31649;&#29702;&#32773; Email</label>
      <input id="email" type="email" autocomplete="username">

      <label for="password">&#23494;&#30908;</label>
      <input id="password" type="password" autocomplete="current-password">

      <button class="primary" onclick="login()">&#30331;&#20837;</button>
      <div id="loginMessage" class="msg"></div>
    </section>

    <section id="adminArea" class="hidden">
      <section class="card">
        <div class="row">
          <div>
            <label for="dateFilter">&#26085;&#26399;</label>
            <select id="dateFilter" onchange="renderSlots()"></select>
          </div>
          <div>
            <label for="statusFilter">&#29376;&#24907;</label>
            <select id="statusFilter" onchange="renderSlots()">
              <option value="booked">&#21482;&#30475;&#24050;&#22577;&#21517;</option>
              <option value="available">&#21482;&#30475;&#21487;&#22577;&#21517;</option>
              <option value="all">&#20840;&#37096;&#26178;&#27573;</option>
            </select>
          </div>
        </div>
        <button class="ghost" onclick="location.href='index.html'">回到報名網頁</button>
        <button class="ghost" onclick="logout()">&#30331;&#20986;&#31649;&#29702;&#38913;</button>
        <button class="primary" onclick="exportCsv()" style="margin-top:10px;">&#21295;&#20986; CSV</button>
        <div id="adminMessage" class="msg"></div>
      </section>

      <section class="card">
        <label>取消報名申請審核</label>
        <div class="slot-list" id="cancelRequestList"></div>
      </section>

      <section class="card">
        <label for="moveFrom">&#23559;&#24050;&#22577;&#21517;&#26178;&#27573;&#31227;&#21040;&#20854;&#20182;&#26178;&#27573;</label>
        <select id="moveFrom"></select>

        <label for="moveTo">&#26032;&#26178;&#27573;&#65288;&#21482;&#26371;&#39023;&#31034;&#21487;&#22577;&#21517;&#26178;&#27573;&#65289;</label>
        <select id="moveTo"></select>

        <button class="secondary" onclick="moveBooking()">&#31227;&#36681;&#22577;&#21517;&#26178;&#27573;</button>
      </section>

      <section class="slot-list" id="slotList"></section>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.9.0/firebase-auth.js";
    import {
      getFirestore,
      collection,
      doc,
      onSnapshot,
      runTransaction,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.9.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDY2SAXwWPxgFWaUHU7h1ARjwtgo16G2Yo",
      authDomain: "emstest-e3ec1.firebaseapp.com",
      projectId: "emstest-e3ec1",
      storageBucket: "emstest-e3ec1.firebasestorage.app",
      messagingSenderId: "887383383886",
      appId: "1:887383383886:web:452e3a1e8f756119f7c81f"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const AVAILABLE = "\u53ef\u5831\u540d";
    const BOOKED = "\u5df2\u9810\u7d04";

    let allSlots = [];
    let unsubscribeSlots = null;
    let allCancelRequests = [];
    let unsubscribeCancelRequests = null;

    window.login = login;
    window.logout = logout;
    window.renderSlots = renderSlots;
    window.releaseSlot = releaseSlot;
    window.approveCancelRequest = approveCancelRequest;
    window.rejectCancelRequest = rejectCancelRequest;
    window.saveNames = saveNames;
    window.moveBooking = moveBooking;
    window.exportCsv = exportCsv;

    onAuthStateChanged(auth, user => {
      document.getElementById("loginCard").classList.toggle("hidden", !!user);
      document.getElementById("adminArea").classList.toggle("hidden", !user);

      if (user) {
        listenSlots();
        listenCancelRequests();
      } else if (unsubscribeSlots) {
        unsubscribeSlots();
        unsubscribeSlots = null;
        if (unsubscribeCancelRequests) {
          unsubscribeCancelRequests();
          unsubscribeCancelRequests = null;
        }
      }
    });

    async function login() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      setLoginMessage("\u767b\u5165\u4e2d...", "");

      try {
        await signInWithEmailAndPassword(auth, email, password);
        setLoginMessage("", "");
      } catch (error) {
        setLoginMessage("\u767b\u5165\u5931\u6557\uff0c\u8acb\u6aa2\u67e5 Email \u8207\u5bc6\u78bc\u3002", "err");
      }
    }

    async function logout() {
      await signOut(auth);
    }

    function listenSlots() {
      if (unsubscribeSlots) unsubscribeSlots();

      unsubscribeSlots = onSnapshot(collection(db, "slots"), snapshot => {
        allSlots = snapshot.docs.map(item => item.data()).sort((a, b) => {
          if (a.dateId !== b.dateId) return a.dateId.localeCompare(b.dateId);
          return a.time.localeCompare(b.time);
        });

        renderFilters();
        renderSlots();
        renderMoveSelectors();
        renderCancelRequests();
      }, error => {
        setAdminMessage(error.message || "\u8b80\u53d6\u8cc7\u6599\u5931\u6557\u3002", "err");
      });
    }

    function listenCancelRequests() {
      if (unsubscribeCancelRequests) unsubscribeCancelRequests();

      unsubscribeCancelRequests = onSnapshot(collection(db, "cancelRequests"), snapshot => {
        allCancelRequests = snapshot.docs.map(item => ({ requestId: item.id, ...item.data() })).sort((a, b) => {
          const aTime = a.requestedAt && a.requestedAt.toMillis ? a.requestedAt.toMillis() : 0;
          const bTime = b.requestedAt && b.requestedAt.toMillis ? b.requestedAt.toMillis() : 0;
          return bTime - aTime;
        });
        renderCancelRequests();
      }, error => {
        setAdminMessage(error.message || "讀取取消申請失敗。", "err");
      });
    }

    function renderFilters() {
      const select = document.getElementById("dateFilter");
      const current = select.value;
      const dates = [...new Set(allSlots.map(slot => slot.dateLabel))];

      select.innerHTML = dates.map(date => `<option value="${date}">${date}</option>`).join("");

      if (current && dates.includes(current)) {
        select.value = current;
      }
    }

    function renderSlots() {
      const date = document.getElementById("dateFilter").value;
      const status = document.getElementById("statusFilter").value;
      const list = document.getElementById("slotList");

      const slots = allSlots.filter(slot => {
        if (slot.dateLabel !== date) return false;
        if (status === "booked") return slot.status === BOOKED;
        if (status === "available") return slot.status === AVAILABLE;
        return true;
      });

      list.innerHTML = slots.map(slot => `
        <article class="slot-item">
          <div class="slot-top">
            <span>${slot.dateLabel} ${slot.session} ${slot.time}</span>
            <span>${slot.status}</span>
          </div>
          <div class="names">${slot.name1 || "\u7a7a\u767d"}\u3001${slot.name2 || "\u7a7a\u767d"}</div>
          <div class="row">
            <input id="name1-${safeId(slot.slotId)}" type="text" value="${escapeHtml(slot.name1 || "")}" placeholder="\u59d3\u540d1">
            <input id="name2-${safeId(slot.slotId)}" type="text" value="${escapeHtml(slot.name2 || "")}" placeholder="\u59d3\u540d2">
          </div>
          <div class="actions">
            <button class="secondary" onclick="saveNames('${slot.slotId}')">\u5132\u5b58\u59d3\u540d</button>
            <button class="danger" onclick="releaseSlot('${slot.slotId}')">\u91cb\u51fa\u70ba\u53ef\u5831\u540d</button>
          </div>
        </article>
      `).join("") || `<section class="card">\u6c92\u6709\u7b26\u5408\u689d\u4ef6\u7684\u8cc7\u6599\u3002</section>`;
    }

    function renderCancelRequests() {
      const list = document.getElementById("cancelRequestList");
      if (!list) return;
      const groups = [];
      const groupMap = new Map();

      allCancelRequests.filter(item => item.status === "pending").forEach(item => {
        const key = getCancelRequestKey(item);
        let group = groupMap.get(key);
        if (!group) {
          group = { item, requests: [] };
          groupMap.set(key, group);
          groups.push(group);
        }
        group.requests.push(item);
      });

      list.innerHTML = groups.map(group => {
        const item = group.item;
        const slot = allSlots.find(current => current.slotId === item.slotId);
        const slotText = slot ? `${slot.status} - ${escapeHtml(slot.name1 || "")}、${escapeHtml(slot.name2 || "")}` : "找不到目前時段資料";
        const duplicateText = group.requests.length > 1
          ? `<br>重複送出：${group.requests.length} 次（本次將一併審核）`
          : "";
        return `
          <article class="slot-item">
            <div class="slot-top">
              <span>${escapeHtml(item.dateLabel || "")} ${escapeHtml(item.session || "")} ${escapeHtml(item.time || "")}</span>
              <span>待審核</span>
            </div>
            <div class="names">申請取消：${escapeHtml(item.name1 || "")}、${escapeHtml(item.name2 || "")}<br>目前狀態：${slotText}${duplicateText}</div>
            <div class="actions">
              <button class="secondary" onclick="approveCancelRequest('${item.requestId}')">同意取消並釋出</button>
              <button class="danger" onclick="rejectCancelRequest('${item.requestId}')">拒絕取消</button>
            </div>
          </article>
        `;
      }).join("") || `<section class="slot-item">目前沒有待審核取消申請。</section>`;
    }

    function renderMoveSelectors() {
      const from = document.getElementById("moveFrom");
      const to = document.getElementById("moveTo");
      const booked = allSlots.filter(slot => slot.status === BOOKED);
      const available = allSlots.filter(slot => slot.status === AVAILABLE);

      from.innerHTML = booked.map(slot => `<option value="${slot.slotId}">${slot.dateLabel} ${slot.session} ${slot.time} - ${escapeHtml(slot.name1 || "")}\u3001${escapeHtml(slot.name2 || "")}</option>`).join("");
      to.innerHTML = available.map(slot => `<option value="${slot.slotId}">${slot.dateLabel} ${slot.session} ${slot.time}</option>`).join("");
    }

    async function saveNames(slotId) {
      const name1 = document.getElementById(`name1-${safeId(slotId)}`).value.trim();
      const name2 = document.getElementById(`name2-${safeId(slotId)}`).value.trim();

      if (!name1 || !name2) {
        setAdminMessage("\u8acb\u586b\u5beb\u5169\u4f4d\u59d3\u540d\u3002", "err");
        return;
      }
      if (name1 === name2) {
        setAdminMessage("兩位姓名不可相同。", "err");
        return;
      }

      try {
        await runTransaction(db, async transaction => {
          const slotRef = doc(db, "slots", slotId);
          const slotDoc = await transaction.get(slotRef);
          if (!slotDoc.exists()) throw new Error("找不到時段資料。");
          const current = slotDoc.data();
          const oldGroupKey = current.groupKey || buildGroupKey(current.name1 || "", current.name2 || "");
          const newGroupKey = buildGroupKey(name1, name2);
          const newGroupRef = doc(db, "bookingGroups", newGroupKey);
          const newGroupDoc = await transaction.get(newGroupRef);
          if (newGroupDoc.exists() && newGroupDoc.data().slotId !== slotId) throw new Error("此兩人組別已完成報名，無法重複報名。");
          if (oldGroupKey && oldGroupKey !== newGroupKey) transaction.delete(doc(db, "bookingGroups", oldGroupKey));
          transaction.update(slotRef, {
            status: BOOKED,
            name1,
            name2,
            groupKey: newGroupKey
          });
          transaction.set(newGroupRef, {
            groupKey: newGroupKey,
            name1,
            name2,
            slotId,
            dateId: current.dateId || "",
            dateLabel: current.dateLabel || "",
            session: current.session || "",
            time: current.time || "",
            createdAt: serverTimestamp()
          });
        });
        setAdminMessage("\u59d3\u540d\u5df2\u5132\u5b58\u3002", "ok");
      } catch (error) {
        setAdminMessage(error.message || "\u5132\u5b58\u5931\u6557\u3002", "err");
      }
    }

    async function releaseSlot(slotId) {
      const slot = allSlots.find(item => item.slotId === slotId);
      if (!slot) return;

      if (!confirm(`\u78ba\u5b9a\u8981\u91cb\u51fa\u9019\u500b\u6642\u6bb5\uff1f\n\n${slot.dateLabel} ${slot.session} ${slot.time}\n${slot.name1 || ""}\u3001${slot.name2 || ""}`)) {
        return;
      }

      try {
        await runTransaction(db, async transaction => {
          const slotRef = doc(db, "slots", slotId);
          const slotDoc = await transaction.get(slotRef);
          if (!slotDoc.exists()) throw new Error("找不到時段資料。");
          const current = slotDoc.data();
          const groupKey = current.groupKey || buildGroupKey(current.name1 || "", current.name2 || "");
          transaction.update(slotRef, {
            status: AVAILABLE,
            name1: "",
            name2: "",
            groupKey: "",
            bookedAt: null
          });
          if (groupKey) transaction.delete(doc(db, "bookingGroups", groupKey));
        });
        setAdminMessage("\u6642\u6bb5\u5df2\u91cb\u51fa\u70ba\u53ef\u5831\u540d\u3002", "ok");
      } catch (error) {
        setAdminMessage(error.message || "\u91cb\u51fa\u5931\u6557\u3002", "err");
      }
    }

    async function moveBooking() {
      const fromId = document.getElementById("moveFrom").value;
      const toId = document.getElementById("moveTo").value;
      const fromSlot = allSlots.find(slot => slot.slotId === fromId);
      const toSlot = allSlots.find(slot => slot.slotId === toId);

      if (!fromSlot || !toSlot) {
        setAdminMessage("\u8acb\u9078\u64c7\u8981\u79fb\u8f49\u7684\u5831\u540d\u8207\u65b0\u6642\u6bb5\u3002", "err");
        return;
      }

      if (!confirm(`\u78ba\u5b9a\u8981\u79fb\u8f49\u5831\u540d\uff1f\n\n\u539f\u6642\u6bb5\uff1a${fromSlot.dateLabel} ${fromSlot.session} ${fromSlot.time}\n\u65b0\u6642\u6bb5\uff1a${toSlot.dateLabel} ${toSlot.session} ${toSlot.time}\n\u4eba\u54e1\uff1a${fromSlot.name1}\u3001${fromSlot.name2}`)) {
        return;
      }

      try {
        await runTransaction(db, async transaction => {
          const fromRef = doc(db, "slots", fromId);
          const toRef = doc(db, "slots", toId);
          const fromDoc = await transaction.get(fromRef);
          const toDoc = await transaction.get(toRef);

          if (!fromDoc.exists() || !toDoc.exists()) throw new Error("\u627e\u4e0d\u5230\u6642\u6bb5\u8cc7\u6599\u3002");

          const source = fromDoc.data();
          const target = toDoc.data();
          const groupKey = source.groupKey || buildGroupKey(source.name1 || "", source.name2 || "");

          if (source.status !== BOOKED) throw new Error("\u539f\u6642\u6bb5\u4e0d\u662f\u5df2\u5831\u540d\u72c0\u614b\u3002");
          if (target.status !== AVAILABLE) throw new Error("\u65b0\u6642\u6bb5\u5df2\u88ab\u9810\u7d04\u3002");

          transaction.update(toRef, {
            status: BOOKED,
            name1: source.name1 || "",
            name2: source.name2 || "",
            groupKey,
            bookedAt: serverTimestamp()
          });

          transaction.update(fromRef, {
            status: AVAILABLE,
            name1: "",
            name2: "",
            groupKey: "",
            bookedAt: null
          });
          if (groupKey) {
            transaction.set(doc(db, "bookingGroups", groupKey), {
              groupKey,
              name1: source.name1 || "",
              name2: source.name2 || "",
              slotId: toId,
              dateId: target.dateId || "",
              dateLabel: target.dateLabel || "",
              session: target.session || "",
              time: target.time || "",
              createdAt: serverTimestamp()
            });
          }
        });

        setAdminMessage("\u5831\u540d\u6642\u6bb5\u5df2\u79fb\u8f49\u3002", "ok");
      } catch (error) {
        setAdminMessage(error.message || "\u79fb\u8f49\u5931\u6557\u3002", "err");
      }
    }

    async function approveCancelRequest(requestId) {
      const request = allCancelRequests.find(item => item.requestId === requestId);
      if (!request) return;
      const relatedRequests = getRelatedPendingCancelRequests(request);
      const duplicateNotice = relatedRequests.length > 1 ? `\n\n另有 ${relatedRequests.length - 1} 筆相同申請，將一併完成審核。` : "";
      if (!confirm(`確定同意取消並釋出時段？\n\n${request.dateLabel} ${request.session} ${request.time}\n${request.name1}、${request.name2}${duplicateNotice}`)) return;

      try {
        const result = await runTransaction(db, async transaction => {
          const slotRef = doc(db, "slots", request.slotId);
          const slotDoc = await transaction.get(slotRef);
          if (!slotDoc.exists()) throw new Error("找不到時段資料。");
          const requestRefs = relatedRequests.map(item => doc(db, "cancelRequests", item.requestId));
          const requestDocs = [];
          for (const requestRef of requestRefs) {
            requestDocs.push(await transaction.get(requestRef));
          }

          const groupKey = getCancelRequestGroupKey(request);
          const currentSlot = slotDoc.data();
          const currentSlotGroupKey = currentSlot.groupKey || buildGroupKey(currentSlot.name1 || "", currentSlot.name2 || "");
          const matchingPending = requestDocs.filter(item => item.exists() && item.data().status === "pending" && getCancelRequestKey({ requestId: item.id, ...item.data() }) === getCancelRequestKey(request));
          if (matchingPending.length === 0) throw new Error("此申請已審核，不能重複處理。");
          if (currentSlot.status === BOOKED && currentSlotGroupKey !== groupKey) throw new Error("目前時段已是其他組別，為避免誤刪新報名，請重新確認。");
          if (currentSlot.status !== BOOKED && currentSlot.status !== AVAILABLE) throw new Error("目前時段狀態異常，無法完成審核。");

          const user = auth.currentUser;
          const releaseResult = currentSlot.status === BOOKED ? "released" : "already_available";

          if (currentSlot.status === BOOKED) {
            transaction.update(slotRef, {
              status: AVAILABLE,
              name1: "",
              name2: "",
              groupKey: "",
              bookedAt: null
            });
            if (groupKey) transaction.delete(doc(db, "bookingGroups", groupKey));
          }

          matchingPending.forEach(item => {
            transaction.update(item.ref, {
              status: "approved",
              resolution: releaseResult,
              reviewedAt: serverTimestamp(),
              reviewedBy: user ? user.uid : "",
              reviewedByEmail: user ? user.email : ""
            });
          });

          return {
            releaseResult,
            reviewedCount: matchingPending.length
          };
        });
        setAdminMessage(
          result.releaseResult === "released"
            ? `已同意取消並釋出時段，共完成 ${result.reviewedCount} 筆相同申請。`
            : `時段原已釋出，共完成 ${result.reviewedCount} 筆遺留申請。`,
          "ok"
        );
      } catch (error) {
        setAdminMessage(error.message || "審核失敗。", "err");
      }
    }

    async function rejectCancelRequest(requestId) {
      const request = allCancelRequests.find(item => item.requestId === requestId);
      if (!request) return;
      const relatedRequests = getRelatedPendingCancelRequests(request);
      const duplicateNotice = relatedRequests.length > 1 ? `\n\n另有 ${relatedRequests.length - 1} 筆相同申請，將一併拒絕。` : "";
      if (!confirm(`確定拒絕此取消申請？\n\n${request.dateLabel} ${request.session} ${request.time}\n${request.name1}、${request.name2}${duplicateNotice}`)) return;

      try {
        const reviewedCount = await runTransaction(db, async transaction => {
          const requestRefs = relatedRequests.map(item => doc(db, "cancelRequests", item.requestId));
          const requestDocs = [];
          for (const requestRef of requestRefs) {
            requestDocs.push(await transaction.get(requestRef));
          }

          const matchingPending = requestDocs.filter(item => item.exists() && item.data().status === "pending" && getCancelRequestKey({ requestId: item.id, ...item.data() }) === getCancelRequestKey(request));
          if (matchingPending.length === 0) throw new Error("此申請已審核，不能重複處理。");
          const user = auth.currentUser;

          matchingPending.forEach(item => {
            transaction.update(item.ref, {
              status: "rejected",
              resolution: "rejected",
              reviewedAt: serverTimestamp(),
              reviewedBy: user ? user.uid : "",
              reviewedByEmail: user ? user.email : ""
            });
          });

          return matchingPending.length;
        });
        setAdminMessage(`已拒絕取消申請，共完成 ${reviewedCount} 筆相同申請。`, "ok");
      } catch (error) {
        setAdminMessage(error.message || "審核失敗。", "err");
      }
    }

    function exportCsv() {
      if (allSlots.length === 0) {
        setAdminMessage("\u76ee\u524d\u6c92\u6709\u8cc7\u6599\u53ef\u532f\u51fa\u3002", "err");
        return;
      }

      const headers = [
        "\u6642\u6bb5ID",
        "\u6e2c\u9a57\u65e5\u671f",
        "\u68af\u6b21",
        "\u6e2c\u9a57\u6642\u9593",
        "\u72c0\u614b",
        "\u53d7\u6e2c\u4eba\u54e1\u59d3\u540d1",
        "\u53d7\u6e2c\u4eba\u54e1\u59d3\u540d2",
        "\u5831\u540d\u6642\u9593"
      ];

      const rows = allSlots.map(slot => [
        slot.slotId || "",
        slot.dateLabel || "",
        slot.session || "",
        slot.time || "",
        slot.status || "",
        slot.name1 || "",
        slot.name2 || "",
        formatBookedAt(slot.bookedAt)
      ]);

      const csv = [headers, ...rows]
        .map(row => row.map(escapeCsv).join(","))
        .join("\n");

      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "\u7b2c\u56db\u5927\u968a\u6551\u8b77\u6280\u8853\u666e\u6e2c\u5831\u540d\u8cc7\u6599.csv";
      link.click();
      URL.revokeObjectURL(url);
      setAdminMessage("CSV \u5df2\u532f\u51fa\u3002", "ok");
    }

    function safeId(value) {
      return value.replace(/[^a-zA-Z0-9]/g, "-");
    }

    function buildGroupKey(name1, name2) {
      return [String(name1 || "").trim(), String(name2 || "").trim()].sort().join("__");
    }

    function getCancelRequestGroupKey(request) {
      return request.groupKey || buildGroupKey(request.name1 || "", request.name2 || "");
    }

    function getCancelRequestKey(request) {
      return `${request.slotId || ""}::${getCancelRequestGroupKey(request)}`;
    }

    function getRelatedPendingCancelRequests(request) {
      const key = getCancelRequestKey(request);
      return allCancelRequests.filter(item => item.status === "pending" && getCancelRequestKey(item) === key);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeCsv(value) {
      const text = String(value ?? "");
      return `"${text.replaceAll('"', '""')}"`;
    }

    function formatBookedAt(value) {
      if (!value) return "";
      const date = value.toDate ? value.toDate() : new Date(value);
      if (isNaN(date.getTime())) return "";

      const yyyy = date.getFullYear();
      const mm = String(date.getMonth() + 1).padStart(2, "0");
      const dd = String(date.getDate()).padStart(2, "0");
      const hh = String(date.getHours()).padStart(2, "0");
      const min = String(date.getMinutes()).padStart(2, "0");
      const ss = String(date.getSeconds()).padStart(2, "0");

      return `${yyyy}/${mm}/${dd} ${hh}:${min}:${ss}`;
    }

    function setLoginMessage(text, type) {
      const msg = document.getElementById("loginMessage");
      msg.textContent = text;
      msg.className = `msg ${type || ""}`;
    }

    function setAdminMessage(text, type) {
      const msg = document.getElementById("adminMessage");
      msg.textContent = text;
      msg.className = `msg ${type || ""}`;
    }
  </script>
</body>
</html>
